version: "1.0"

services:
  # 1. Backend Web API (Node.js)
  - name: vtopcc-backend
    type: web
    directory: "backend"
    build:
      engine: "node"
      command: "npm install && npm run build"
    deploy:
      port: 5000
      command: "npm run start"
    env:
      NODE_ENV: "production"
      PORT: "5000"
      JWT_SECRET:
        generate_value: true
      ADMIN_ROLL_NUMBERS: "25BCE5232"

  # 2. Frontend Static SPA (Vite / React)
  - name: vtopcc
    type: static
    directory: "frontend"
    build:
      command: "npm install && npm run build"
      output_dir: "dist"
    env:
      VITE_API_URL: "${services.vtopcc-backend.url}"
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "${services.vtopcc-backend.url}/api/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
