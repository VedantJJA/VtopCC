version: "1.0"
services:
  # 1. Frontend Static SPA
  - name: vtopcc
    type: static
    directory: "frontend"
    build:
      command: "npm install && npm run build"
      output_dir: "dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend Web API
  - name: vtopcc-backend
    type: web
    directory: "backend"
    build:
      engine: "node"
      command: "npm install"
    deploy:
      port: 5000
      command: "npm start"
